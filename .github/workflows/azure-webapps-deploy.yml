name: CI/CD Deployment to Azure

on:
  push:
    tags:
      - '*'   
jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: pytest

      - name: Build application
        run: |
          echo "Build-Schritt (z.B. minifizieren, paketieren, statische Dateien generieren)"
          # hier könntest du z.B. PyInstaller oder andere Build Tools nutzen
          # pyinstaller --onefile main.py

      - name: Deploy to Azure Web App
        if: success()  
        uses: azure/webapps-deploy@v2
        with:
          app-name: <DEIN_AZURE_APP_NAME>
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: .

      - name: Deployment bestätigt
        if: success()
        run: |
          echo "Deployment erfolgreich abges
